# The cheap half of the update cycle (design, "Цикл обновлений Chromium"):
# repository checks and whether the hooks apply, without a Chromium
# checkout. Full builds stay on the developer's Mac.
name: check

on:
  push:
    branches: [main]
  schedule:
    # Daily: does Chrome's newest stable for Mac take the hooks as they are?
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          # The pushed commits, for their System-Change: lines and the baseline.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install shellcheck
        run: brew install shellcheck
      - name: Shell, tooling and WebUI unit tests
        run: tooling/check
      - name: Architecture rules (AGENTS.md)
        run: |
          tooling/arch-check --strict
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = 0000000000000000000000000000000000000000 ] ||
             ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            # A new branch, a force push or another trigger: at least the head.
            echo "::warning::no previous commit to compare with; checking ${{ github.sha }} alone"
            before="$(git rev-parse "${{ github.sha }}^" 2>/dev/null || true)"
          fi
          if [ -n "$before" ]; then
            tooling/arch-check --baseline-grew "$before"
            tooling/arch-check --check-commits "$before..${{ github.sha }}"
          fi
      - name: Hooks apply to the pin
        run: tooling/check-patches

  # The forecast of the next bumps: do the hooks apply and are the Chromium
  # headers our code includes still there? Beta and Dev say it 4-8 weeks
  # before a Stable needs it; they warn, Stable fails.
  newest:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        channel: [Stable, Beta, Dev]
    continue-on-error: ${{ matrix.channel != 'Stable' }}
    steps:
      - uses: actions/checkout@v5
      - name: Hooks and headers against Chrome's newest ${{ matrix.channel }} for Mac
        run: tooling/forecast "${{ matrix.channel }}"
